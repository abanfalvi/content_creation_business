[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-generation"
version = "0.1.0"
description = "Multi-agent pipeline that turns books into podcast episodes: content drafting, production, and distribution."
requires-python = ">=3.13"
dependencies = [
    "python-dotenv==1.2.2",
    "pydantic==2.12.5",
    "requests==2.34.2",
    "numpy==2.5.2",
    "tqdm==4.70.0",
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "dropbox==12.2.1",
    "python-frontmatter==1.3.0",
    "hdbscan==0.8.44",
    "umap-learn==0.5.12",
    "huggingface_hub==1.27.0",
    "langchain==1.3.14",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.8",
    "langchain-cohere==0.6.0",
    "langchain-core==1.5.3",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openrouter==0.2.7",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.10",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.4",
    "mcp==1.29.0",
    "openrouter==0.11.46",
    "opik==2.2.23",
    "pydub==0.25.1",
    "static_ffmpeg==3.0",
    "typer==0.27.1",
    "rich==15.0.0",
    "prompt_toolkit==3.0.53",
    "pyfiglet==1.0.4",
]

[project.optional-dependencies]
notebook = [
    "ipython==9.16.1",
    "nest-asyncio==1.6.0",
]

# Registers the `podcast` shell command once src/cli/main.py defines `app`.
# `pip install -e .` will succeed before that file exists; running `podcast`
# will not, until the CLI entry point is actually built.
[project.scripts]
podcast = "src.cli.main:app"

# No src/<pkg>/__init__.py files exist anywhere in this repo — code imports
# things like `from src.agents...` and `from src.vector_db import ...`, i.e.
# "src" itself is the top-level package name. These are implicit namespace
# packages (PEP 420), so discovery has to be told to include them explicitly.
[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
namespaces = true
