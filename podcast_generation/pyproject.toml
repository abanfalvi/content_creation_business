[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[project]
name = "podcast-generation"
version = "0.1.0"
description = "Multi-agent pipeline that turns books into podcast episodes: content drafting and production."
requires-python = ">=3.13"
dependencies = [
    "python-dotenv==1.2.2",
    "pydantic==2.12.5",
    "requests==2.34.2",
    "numpy==2.5.2",
    "tqdm==4.70.0",
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "dropbox==12.2.1",
    "python-frontmatter==1.3.0",
    "hdbscan==0.8.44",
    "umap-learn==0.5.12",
    "huggingface_hub==1.27.0",
    "langchain==1.4.9",
    "langchain-chroma==1.1.0",
    "langchain-classic==1.0.8",
    "langchain-core==1.7.6",
    "langchain-mcp-adapters==0.3.2",
    "langchain-openrouter==0.2.7",
    "langchain-tavily==0.2.18",
    "langchain-text-splitters==1.1.2",
    "langgraph==1.2.20",
    "langgraph-checkpoint-sqlite==3.1.1",
    "langgraph-checkpoint-postgres==3.1.2",
    "psycopg[binary,pool]==3.3.4",
    "mcp==1.29.0",
    "openrouter==1.3.139",
    "opik==2.2.23",
    "pydub==0.25.1",
    "static_ffmpeg==3.0",
    # Previously installed in the venv by hand but never declared:
    "deepagents==0.7.34",      # script_planner_agent
    "audioop-lts==0.2.2",      # pydub needs audioop, which Python 3.13 removed
    "fastapi==0.162.5",
    "python-multipart==0.0.33",
    "pypdf==7.0.1",
    "uvicorn==0.54.0",
    "e2b>=2.64.0",
]

[dependency-groups]
# Installed by default with `uv sync`.
dev = [
    "ruff==0.16.4",
    "pyright==1.1.414",
    # Makes Python's HTTPS use the OS certificate store (needed behind a TLS-inspecting
    # proxy; harmless elsewhere). This machine's venv relied on it without declaring it.
    "pip-system-certs==5.3",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "httpx==0.28.1",
]

# `uv run podcast-server` starts the web app (API + built frontend).
[project.scripts]
podcast-server = "podcast_generation.api.main:run"

# The importable package lives at the repo root (podcast_generation/), not under src/.
# Only the top-level package has an __init__.py; subpackages are implicit namespace
# packages (PEP 420), which uv_build and Python both accept inside a regular package.
[tool.uv.build-backend]
module-root = ""
module-name = "podcast_generation"

[tool.uv]
# Every published langchain-openrouter declares openrouter<1.0, but the code uses the
# openrouter 1.x SDK directly (script_planner_agent imports openrouter.components) and
# this combination is what the project has been running on. Remove this override once
# langchain-openrouter supports openrouter 1.x.
override-dependencies = ["openrouter==1.3.139"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_default_fixture_loop_scope = "function"
